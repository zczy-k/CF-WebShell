#:schema
name = "starport-sync"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 自定义域。挂在这里的好处是：`wrangler deploy` 一次就把域名绑好，
# 不用再去后台点 Domains & Routes；换 Worker 名字的时候也不会出现
# "域名还挂在老 Worker 上、客户端连不上"这种事。
#
# 注意：routes 必须是**顶层**键。要是写在 [[d1_databases]] 下面，会被 TOML
# 吞进那个表里，wrangler 只 warning 一句
# "Unexpected fields found in d1_databases[0]: routes"，然后域名根本没绑上。
routes = [
  { pattern = "starport.zczy6.dpdns.org", custom_domain = true }
]

# D1 绑定。同步文档整份存一列 JSON，见 schema.sql 里的说明。
#
# 本仓库已部署好，直接 `npx wrangler deploy` 即可，下面 uuid 不用动。
# fork 出去自己部署才需要换库：
#   npx wrangler d1 create starport-sync
#   → 把输出里的 database_id 填到下面（下面的值只对应本仓库那个库）
#   npx wrangler d1 execute starport-sync --remote --file=schema.sql
#   npx wrangler secret put BOOTSTRAP_SECRET   # 至少 40 位随机字符
[[d1_databases]]
binding = "DB"
database_name = "starport-sync"
# 这个 uuid 就是线上正在用的那个库（APAC），别再改回占位符了 ——
# 占位符会让 `wrangler d1 execute --remote` 直接报 Invalid uuid。
database_id = "4f6150aa-4580-479c-87f5-1e7ca6fb7e28"

# 不用 KV：KV 免费额度 1000 写/天，而且写入后最多 60 秒才全球可见。
# 同步的"删了必须真删"这条要求容不下那么久的延迟。

[vars]
# 单个文档的体积上限（字节）。50 个站点大概 20-30 KB，512 KB 是给
# 极端情况（几百个站点带 header）留的余量。
MAX_DOC_BYTES = "524288"

# 每台设备每小时最多推几次。60 次 = 平均一分钟一次，远超正常手速。
RATE_WRITES_PER_HOUR = "60"

# 每个空间每小时最多推几次。防止某台设备死循环把额度烧光。
RATE_SPACE_PER_HOUR = "2000"

# 设备数上限。0 = 不限（配对过的都能用）。
MAX_DEVICES = "0"

# 配对码有效期（秒）。
PAIR_TTL_SECONDS = "600"

# 历史版本保留几版。每次推送成功多写一行，20 版足够捞回"昨天还好好的"。
HISTORY_KEEP = "20"

# 历史版本保留几天。超过就丢 —— 太老的版本已经没有恢复价值，只是占地方。
HISTORY_TTL_DAYS = "7"
